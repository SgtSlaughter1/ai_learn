<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#183B2B">
    <title>Offline — Antigravity AI</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f1a14;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            background: #1a2b22;
            border: 1px solid #2d4a38;
            border-radius: 24px;
            padding: 48px 40px;
            max-width: 480px;
            width: 100%;
            text-align: center;
        }
        .icon {
            width: 64px; height: 64px;
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.2);
            border-radius: 50%;
            margin: 0 auto 24px;
            display: flex; align-items: center; justify-content: center;
        }
        svg { width: 32px; height: 32px; color: #f59e0b; stroke: #f59e0b; fill: none; }
        h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 12px; }
        p  { color: #94a3b8; font-size: 0.9rem; line-height: 1.6; margin-bottom: 32px; }
        .links { display: flex; flex-direction: column; gap: 12px; }
        a {
            display: block; padding: 14px 24px;
            background: #183B2B; color: #fff;
            border-radius: 12px; text-decoration: none;
            font-weight: 700; font-size: 0.875rem;
            border: 1px solid #2d5940;
            transition: opacity .2s;
        }
        a:hover { opacity: .85; }
        a.secondary {
            background: transparent; color: #94a3b8;
            border: 1px solid #2d4a38;
        }
        .badge {
            display: inline-block;
            padding: 4px 10px;
            background: rgba(245,158,11,.1);
            color: #f59e0b;
            border: 1px solid rgba(245,158,11,.2);
            border-radius: 6px;
            font-size: .7rem;
            font-weight: 700;
            letter-spacing: .05em;
            text-transform: uppercase;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">
            <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 2.829a4.978 4.978 0 01-1.414-2.83m-1.414 5.658a9 9 0 01-2.167-9.238m7.824 2.167a1 1 0 111.414 1.414m-1.414-1.414L3 3"/>
            </svg>
        </div>
        <div class="badge">You're Offline</div>
        <h1>This page isn't cached yet</h1>
        <p>
            This specific page wasn't downloaded for offline use.
            Head to a page you've already visited, or reconnect to load it.
        </p>
        <div class="links">
            <a href="/dashboard">Go to Dashboard</a>
            <a href="/subjects">Browse Subjects</a>
            <a href="/flashcards">Active Recall Flashcards</a>
            <a href="javascript:history.back()" class="secondary">← Go Back</a>
        </div>
    </div>
    <script>
        // Auto-redirect to dashboard when connection is restored
        window.addEventListener('online', () => {
            window.location.reload();
        });
    </script>
</body>
</html>
