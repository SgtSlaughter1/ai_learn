name: 🚀 Deploy Laravel + Inertia to InfinityFree

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy to ailearn.gt.tc
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # ── PHP ───────────────────────────────────────────────
      - name: 🔧 Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, dom, filter, gd, json, zip, curl, opcache
          coverage: none

      # ── Composer ──────────────────────────────────────────
      - name: 📦 Install Composer dependencies (production)
        run: composer install --optimize-autoloader --no-dev --no-interaction --prefer-dist

      # ── Node.js / Vite ────────────────────────────────────
      - name: 🔧 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Node dependencies
        run: npm ci

      - name: 🏗️ Build frontend (Vite + Inertia)
        env:
          VITE_APP_NAME: "Antigravity AI"
          VITE_BASE_URL: "https://ailearn.gt.tc"
          VITE_API_BASE_URL: "https://ailearn.gt.tc"
          VITE_STORAGE_URL: "https://ailearn.gt.tc/storage"
        run: npm run build

      # ── Create .env from GitHub Secrets ───────────────────
      - name: 📝 Create .env file
        run: |
          echo 'APP_NAME="Antigravity AI"' > .env
          echo 'APP_ENV=production' >> .env
          echo 'APP_KEY=${{ secrets.APP_KEY }}' >> .env
          echo 'APP_DEBUG=false' >> .env
          echo 'APP_URL=https://ailearn.gt.tc' >> .env
          echo 'LOG_CHANNEL=stack' >> .env
          echo 'LOG_LEVEL=error' >> .env
          echo 'DB_CONNECTION=mysql' >> .env
          echo 'DB_HOST=${{ secrets.DB_HOST }}' >> .env
          echo 'DB_PORT=3306' >> .env
          echo 'DB_DATABASE=${{ secrets.DB_DATABASE }}' >> .env
          echo 'DB_USERNAME=${{ secrets.DB_USERNAME }}' >> .env
          echo 'DB_PASSWORD=${{ secrets.DB_PASSWORD }}' >> .env
          echo 'SESSION_DRIVER=file' >> .env
          echo 'CACHE_STORE=file' >> .env
          echo 'FILESYSTEM_DISK=local' >> .env
          echo 'QUEUE_CONNECTION=sync' >> .env

      # ── Laravel optimizations ─────────────────────────────
      - name: 🔑 Generate APP_KEY (if missing)
        run: php artisan key:generate --force 2>/dev/null || true

      - name: 🧹 Clear Caches
        run: |
          php artisan config:clear
          php artisan route:clear
          php artisan view:clear
          rm -f bootstrap/cache/*.php

      # ── Create root index.php ─────────────────────────────
      # On InfinityFree the FTP root IS htdocs, so vendor/ is at the same level
      # The root index.php bootstraps Laravel directly from vendor/ and bootstrap/
      - name: 📄 Create root index.php
        run: cp public/root-index.php ./index.php

      # ── Remove files not needed on server ─────────────────
      - name: 🧹 Remove unnecessary files/folders
        run: |
          rm -rf \
            tests/ \
            node_modules/ \
            .git/ \
            .github/ \
            .editorconfig \
            .gitattributes \
            .gitignore \
            storage/framework/cache/data/* \
            storage/framework/views/* \
            storage/logs/* \
            .env.example \
            phpunit.xml \
            README.md \
            DEPLOY_GUIDE.md \
            CHANGELOG.md \
            package.json \
            package-lock.json \
            vite.config.ts \
            tailwind.config.js \
            postcss.config.js \
            tsconfig.json \
            tsconfig.node.json \
            public/extract.php \
            public/server-index.php \
            public/root-index.php \
            docs/ \
            content/

          # Ensure storage directories exist (even if empty) so Laravel doesn't error
          mkdir -p storage/framework/cache/data
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/views
          mkdir -p storage/logs
          mkdir -p bootstrap/cache

          # Create .gitkeep files so lftp uploads the empty directories
          touch storage/framework/cache/data/.gitkeep
          touch storage/framework/sessions/.gitkeep
          touch storage/framework/views/.gitkeep
          touch storage/logs/.gitkeep
          touch bootstrap/cache/.gitkeep

          echo "=== Deploy size ==="
          du -sh .
          echo "=== File count ==="
          find . -type f | wc -l

      # ── Deploy to InfinityFree via lftp ────────────────────
      # Using lftp mirror instead of SamKirkland/FTP-Deploy-Action because:
      # - InfinityFree blocks IPs after too many rapid connections (FTP-Deploy-Action opens many)
      # - lftp supports retries, parallel transfers, and passive mode natively
      # - lftp handles InfinityFree's SSL certificate issues gracefully
      - name: 📦 Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: 🚀 Deploy via lftp mirror
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ftpupload.net
        run: |
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<EOF
          set ssl:verify-certificate no
          set ftp:ssl-allow yes
          set ftp:passive-mode yes
          set net:timeout 30
          set net:max-retries 5
          set net:reconnect-interval-base 5
          set net:reconnect-interval-multiplier 1
          set mirror:parallel-transfer-count 4
          set ftp:timezone ""

          # Mirror the entire build to the server root
          # --reverse  = upload local -> remote
          # --delete   = remove remote files not present locally
          # --verbose  = show what's being transferred
          # --no-perms = don't try to set permissions (InfinityFree ignores them)
          # --parallel = upload multiple files at once
          # --exclude-glob patterns skip files we don't want on the server
          mirror --reverse --delete --verbose --no-perms --parallel=4 \
            --exclude-glob .DS_Store \
            --exclude-glob "*.log" \
            --exclude-glob "*.map" \
            ./ /

          bye
          EOF

      - name: 🎉 Deployment finished
        run: echo "Deployment to https://ailearn.gt.tc/ completed!"
