name: 🚀 Deploy Laravel + Inertia to InfinityFree

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy to ailearn.gt.tc
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # ── PHP ───────────────────────────────────────────────
      - name: 🔧 Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, dom, filter, gd, json, zip, curl, opcache
          coverage: none

      # ── Composer ──────────────────────────────────────────
      - name: 📦 Install Composer dependencies (production)
        run: composer install --optimize-autoloader --no-dev --no-interaction --prefer-dist

      # ── Node.js / Vite ────────────────────────────────────
      - name: 🔧 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Node dependencies
        run: npm ci

      - name: 🏗️ Build frontend (Vite + Inertia)
        env:
          VITE_APP_NAME: "Antigravity AI"
          VITE_BASE_URL: "https://ailearn.gt.tc"
          VITE_API_BASE_URL: "https://ailearn.gt.tc"
          VITE_STORAGE_URL: "https://ailearn.gt.tc/storage"
        run: npm run build

      # ── Create .env from GitHub Secrets ───────────────────
      - name: 📝 Create .env file
        run: |
          cat > .env << ENVEOF
          APP_NAME="${{ vars.APP_NAME }}"
          APP_ENV=production
          APP_KEY=${{ secrets.APP_KEY }}
          APP_DEBUG=false
          APP_URL=https://ailearn.gt.tc
          LOG_CHANNEL=stack
          LOG_LEVEL=error
          DB_CONNECTION=mysql
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=3306
          DB_DATABASE=${{ secrets.DB_DATABASE }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          SESSION_DRIVER=file
          CACHE_STORE=file
          FILESYSTEM_DISK=local
          QUEUE_CONNECTION=sync
          ENVEOF

      # ── Laravel optimizations ─────────────────────────────
      - name: 🔑 Generate APP_KEY (if missing)
        run: php artisan key:generate --force 2>/dev/null || true

      - name: 🧹 Clear Caches
        run: |
          php artisan config:clear
          php artisan route:clear
          php artisan view:clear
          rm -f bootstrap/cache/*.php

      # ── Cleanup before deploy ─────────────────────────────
      - name: 🧹 Remove unnecessary files/folders
        run: |
          rm -rf \
            tests/ \
            node_modules/ \
            .git/ \
            .github/ \
            storage/framework/cache/data/* \
            storage/framework/views/* \
            storage/logs/* \
            .env.example \
            phpunit.xml \
            README.md \
            package-lock.json \
            vite.config.ts \
            tailwind.config.js \
            postcss.config.js \
            tsconfig.json \
            tsconfig.node.json

      # ── Prepare InfinityFree structure ────────────────────
      # InfinityFree FTP root = hosting root
      # htdocs/ = web root (Apache document root)
      - name: 📁 Prepare InfinityFree directory structure
        run: |
          mkdir -p /tmp/deploy/htdocs

          # Copy public/ contents into htdocs/ (web root)
          cp -r public/* /tmp/deploy/htdocs/

          # Copy Laravel framework files to parent (above htdocs)
          cp -r app /tmp/deploy/
          cp -r bootstrap /tmp/deploy/
          cp -r config /tmp/deploy/
          cp -r database /tmp/deploy/
          cp -r resources /tmp/deploy/
          cp -r routes /tmp/deploy/
          cp -r vendor /tmp/deploy/
          cp composer.json /tmp/deploy/
          cp composer.lock /tmp/deploy/
          cp artisan /tmp/deploy/
          cp .env /tmp/deploy/

          # Make storage writable
          mkdir -p /tmp/deploy/storage/app/public
          mkdir -p /tmp/deploy/storage/framework/cache/data
          mkdir -p /tmp/deploy/storage/framework/sessions
          mkdir -p /tmp/deploy/storage/framework/views
          mkdir -p /tmp/deploy/storage/logs
          chmod -R 775 /tmp/deploy/storage
          chmod -R 775 /tmp/deploy/bootstrap/cache

      # ── Write index.php (no leading spaces!) ──────────────
      - name: 📄 Create htdocs/index.php
        run: |
          cat > /tmp/deploy/htdocs/index.php << 'ROOTPHP'
<?php

use Illuminate\Http\Request;

define('LARAVEL_START', microtime(true));

// Determine if the application is in maintenance mode...
if (file_exists($maintenance = __DIR__.'/../storage/framework/maintenance.php')) {
    require $maintenance;
}

// Register the Composer autoloader...
require __DIR__.'/../vendor/autoload.php';

// Bootstrap Laravel and handle the request...
(require_once __DIR__.'/../bootstrap/app.php')
    ->handleRequest(Request::capture());
ROOTPHP

      # ── Deploy to InfinityFree via FTP ────────────────────
      - name: 🚀 Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftpupload.net
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: /tmp/deploy/
          server-dir: /
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            **/tests/**
            **/.env.example
            **/phpunit.xml
            **/.DS_Store
            **/*.log
          dangerous-clean-slate: false
          timeout: 86400000
          log-level: standard

      - name: 🎉 Deployment finished
        run: echo "Deployment to https://ailearn.gt.tc/ completed! ✨"
