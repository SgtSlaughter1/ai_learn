name: 🚀 Deploy Laravel + Inertia to InfinityFree

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy to ailearn.gt.tc
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # ── PHP ───────────────────────────────────────────────
      - name: 🔧 Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, dom, filter, gd, json, zip, curl, opcache
          coverage: none

      # ── Composer ──────────────────────────────────────────
      - name: 📦 Install Composer dependencies (production)
        run: composer install --optimize-autoloader --no-dev --no-interaction --prefer-dist

      # ── Node.js / Vite ────────────────────────────────────
      - name: 🔧 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Node dependencies
        run: npm ci

      - name: 🏗️ Build frontend (Vite + Inertia)
        env:
          VITE_APP_NAME: "Antigravity AI"
          VITE_BASE_URL: "https://ailearn.gt.tc"
          VITE_API_BASE_URL: "https://ailearn.gt.tc"
          VITE_STORAGE_URL: "https://ailearn.gt.tc/storage"
        run: npm run build

      # ── Create .env from GitHub Secrets ───────────────────
      - name: 📝 Create .env file
        run: |
          echo 'APP_NAME="Antigravity AI"' > .env
          echo 'APP_ENV=production' >> .env
          echo 'APP_KEY=${{ secrets.APP_KEY }}' >> .env
          echo 'APP_DEBUG=false' >> .env
          echo 'APP_URL=https://ailearn.gt.tc' >> .env
          echo 'LOG_CHANNEL=stack' >> .env
          echo 'LOG_LEVEL=error' >> .env
          echo 'DB_CONNECTION=mysql' >> .env
          echo 'DB_HOST=${{ secrets.DB_HOST }}' >> .env
          echo 'DB_PORT=3306' >> .env
          echo 'DB_DATABASE=${{ secrets.DB_DATABASE }}' >> .env
          echo 'DB_USERNAME=${{ secrets.DB_USERNAME }}' >> .env
          echo 'DB_PASSWORD=${{ secrets.DB_PASSWORD }}' >> .env
          echo 'SESSION_DRIVER=file' >> .env
          echo 'CACHE_STORE=file' >> .env
          echo 'FILESYSTEM_DISK=local' >> .env
          echo 'QUEUE_CONNECTION=sync' >> .env

      # ── Laravel optimizations ─────────────────────────────
      - name: 🔑 Generate APP_KEY (if missing)
        run: php artisan key:generate --force 2>/dev/null || true

      - name: 🧹 Clear Caches
        run: |
          php artisan config:clear
          php artisan route:clear
          php artisan view:clear
          rm -f bootstrap/cache/*.php

      # ── Remove files not needed on server ─────────────────
      - name: 🧹 Remove unnecessary files/folders
        run: |
          rm -rf \
            tests/ \
            node_modules/ \
            .git/ \
            .github/ \
            .editorconfig \
            .gitattributes \
            .gitignore \
            storage/framework/cache/data/* \
            storage/framework/views/* \
            storage/logs/* \
            .env.example \
            phpunit.xml \
            README.md \
            package.json \
            package-lock.json \
            vite.config.ts \
            tailwind.config.js \
            postcss.config.js \
            tsconfig.json \
            tsconfig.node.json \
            public/extract.php \
            public/server-index.php \
            docs/ \
            content/

          # ── Clean vendor: remove non-essential files ──
          # Safe: only deletes files INSIDE vendor packages (not vendor itself)
          echo "=== Cleaning vendor ==="
          find vendor/ -mindepth 2 -name "*.md" -type f -delete 2>/dev/null || true
          find vendor/ -mindepth 2 -name "*.txt" -type f -not -name "LICENSE*" -delete 2>/dev/null || true
          find vendor/ -mindepth 2 -name "*.map" -type f -delete 2>/dev/null || true
          find vendor/ -mindepth 2 -name "*.xml" -type f -not -name "composer.json" -delete 2>/dev/null || true
          find vendor/ -mindepth 2 -name "*.neon" -type f -delete 2>/dev/null || true
          find vendor/ -mindepth 2 -name "*.yml" -type f -delete 2>/dev/null || true
          find vendor/ -mindepth 2 -name "*.yaml" -type f -delete 2>/dev/null || true
          find vendor/ -mindepth 2 -name "*.dist" -type f -delete 2>/dev/null || true
          find vendor/ -mindepth 2 -name "*.xml.dist" -type f -delete 2>/dev/null || true
          find vendor/ -mindepth 2 \( -name ".gitignore" -o -name ".gitattributes" -o -name ".editorconfig" -o -name ".php-cs-fixer*" -o -name "Makefile" -o -name "Dockerfile*" -o -name "docker-compose*" \) -type f -delete 2>/dev/null || true
          find vendor/ -mindepth 2 -type d \( -name "docs" -o -name "doc" -o -name "Examples" -o -name "example" -o -name "tests" -o -name "Test" -o -name "test" \) -exec rm -rf {} + 2>/dev/null || true
          find vendor/ -mindepth 2 -type d -name ".github" -exec rm -rf {} + 2>/dev/null || true
          echo "=== Vendor after cleanup ==="
          du -sh vendor/

          echo "=== Deploy size ==="
          du -sh .
          echo "=== File count ==="
          find . -type f | wc -l

      # ── Create root .htaccess ─────────────────────────────
      # Rewrites all requests into the public/ subdirectory
      - name: 📄 Create root .htaccess
        run: |
          echo 'RewriteEngine On' > .htaccess
          echo 'RewriteRule ^storage/(.*)$ /storage/app/public/$1 [END]' >> .htaccess
          echo 'RewriteRule (.*) /public/$1 [L]' >> .htaccess

      # ── Deploy to InfinityFree via FTP ────────────────────
      - name: 🚀 Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftpupload.net
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /
          exclude: |
            **/.git*
            **/.github/**/
            **/node_modules/**/
            **/tests/**/
            **/.env.example
            **/phpunit.xml
            **/.DS_Store
            **/*.log
            **/*.map
            **/docs*/
            **/docs*
            **/doc/**/
            **/content*/
            **/.editorconfig
            **/.gitignore
            **/.gitattributes
            **/extract.php
            **/server-index.php
          dangerous-clean-slate: false
          timeout: 86400000
          log-level: standard

      - name: 🎉 Deployment finished
        run: echo "Deployment to https://ailearn.gt.tc/ completed!"
