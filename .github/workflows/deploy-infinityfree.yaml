name: 🚀 Deploy Laravel + Inertia to InfinityFree

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy to ailearn.gt.tc
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # ── PHP ───────────────────────────────────────────────
      - name: 🔧 Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, dom, filter, gd, json, zip, curl, opcache
          coverage: none

      # ── Composer ──────────────────────────────────────────
      - name: 📦 Install Composer dependencies (production)
        run: composer install --optimize-autoloader --no-dev --no-interaction --prefer-dist

      # ── Node.js / Vite ────────────────────────────────────
      - name: 🔧 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Node dependencies
        run: npm ci

      - name: 🏗️ Build frontend (Vite + Inertia)
        env:
          VITE_APP_NAME: "Antigravity AI"
          VITE_BASE_URL: "https://ailearn.gt.tc"
          VITE_API_BASE_URL: "https://ailearn.gt.tc"
          VITE_STORAGE_URL: "https://ailearn.gt.tc/storage"
        run: npm run build

      # ── Create .env from GitHub Secrets ───────────────────
      - name: 📝 Create .env file
        run: |
          echo 'APP_NAME="Antigravity AI"' > .env
          echo 'APP_ENV=production' >> .env
          echo 'APP_KEY=${{ secrets.APP_KEY }}' >> .env
          echo 'APP_DEBUG=false' >> .env
          echo 'APP_URL=https://ailearn.gt.tc' >> .env
          echo 'LOG_CHANNEL=stack' >> .env
          echo 'LOG_LEVEL=error' >> .env
          echo 'DB_CONNECTION=mysql' >> .env
          echo 'DB_HOST=${{ secrets.DB_HOST }}' >> .env
          echo 'DB_PORT=3306' >> .env
          echo 'DB_DATABASE=${{ secrets.DB_DATABASE }}' >> .env
          echo 'DB_USERNAME=${{ secrets.DB_USERNAME }}' >> .env
          echo 'DB_PASSWORD=${{ secrets.DB_PASSWORD }}' >> .env
          echo 'SESSION_DRIVER=file' >> .env
          echo 'CACHE_STORE=file' >> .env
          echo 'FILESYSTEM_DISK=local' >> .env
          echo 'QUEUE_CONNECTION=sync' >> .env

      # ── Laravel optimizations ─────────────────────────────
      - name: 🔑 Generate APP_KEY (if missing)
        run: php artisan key:generate --force 2>/dev/null || true

      - name: 🧹 Clear Caches
        run: |
          php artisan config:clear
          php artisan route:clear
          php artisan view:clear
          rm -f bootstrap/cache/*.php

      # ── Remove files not needed on server ─────────────────
      - name: 🧹 Remove unnecessary files/folders
        run: |
          rm -rf \
            tests/ \
            node_modules/ \
            .git/ \
            .github/ \
            .editorconfig \
            .gitattributes \
            .gitignore \
            storage/framework/cache/data/* \
            storage/framework/views/* \
            storage/logs/* \
            .env.example \
            phpunit.xml \
            README.md \
            package.json \
            package-lock.json \
            vite.config.ts \
            tailwind.config.js \
            postcss.config.js \
            tsconfig.json \
            tsconfig.node.json \
            .htaccess

      # ── 🚀 AGGRESSIVE VENDOR CLEANUP ─────────────────────
      - name: ⚡ Clean vendor/ — remove tests, docs, maps, dev files
        run: |
          echo "=== Vendor size BEFORE cleanup ==="
          du -sh vendor/

          find vendor/ -type d \( -name "tests" -o -name "Test" -o -name "test" -o -name "testbench" \) -exec rm -rf {} + 2>/dev/null || true
          find vendor/ -type d \( -name "docs" -o -name "doc" -o -name "Examples" -o -name "example" \) -exec rm -rf {} + 2>/dev/null || true
          find vendor/ -name "*.map" -delete 2>/dev/null || true
          find vendor/ -name "*.md" -delete 2>/dev/null || true
          find vendor/ -name "*.txt" -not -name "LICENSE*" -delete 2>/dev/null || true
          find vendor/ -name ".git" -type d -exec rm -rf {} + 2>/dev/null || true
          find vendor/ -name ".github" -type d -exec rm -rf {} + 2>/dev/null || true
          find vendor/ \( -name ".gitignore" -o -name ".gitattributes" -o -name ".editorconfig" \
            -o -name ".php-cs-fixer*" -o -name "phpstan*" -o -name "phpunit.xml*" \
            -o -name ".phpunit.result.cache" -o -name "Makefile" -o -name "Dockerfile*" \
            -o -name "docker-compose*" -o -name ".travis.yml" \) -delete 2>/dev/null || true
          find vendor/ -name ".circleci" -type d -exec rm -rf {} + 2>/dev/null || true
          find vendor/ -type d -empty -delete 2>/dev/null || true

          echo "=== Vendor size AFTER cleanup ==="
          du -sh vendor/
          echo "=== Total files ==="
          find . -type f | wc -l

      # ── Prepare for InfinityFree ──────────────────────────
      # ZIP contains files directly (app/, vendor/, public/, etc.)
      # extract.php extracts to parent of htdocs = FTP root
      # Then parent .htaccess rewrites everything into public/
      - name: 📁 Prepare deploy package
        run: |
          rm -rf /tmp/deploy
          mkdir -p /tmp/deploy

          cp -r app /tmp/deploy/
          cp -r bootstrap /tmp/deploy/
          cp -r config /tmp/deploy/
          cp -r database /tmp/deploy/
          cp -r public /tmp/deploy/
          cp -r resources /tmp/deploy/
          cp -r routes /tmp/deploy/
          cp -r vendor /tmp/deploy/
          cp .env /tmp/deploy/
          cp artisan /tmp/deploy/
          cp composer.json /tmp/deploy/
          cp composer.lock /tmp/deploy/

          # Make storage writable
          mkdir -p /tmp/deploy/storage/app/public
          mkdir -p /tmp/deploy/storage/framework/cache/data
          mkdir -p /tmp/deploy/storage/framework/sessions
          mkdir -p /tmp/deploy/storage/framework/views
          mkdir -p /tmp/deploy/storage/logs
          chmod -R 775 /tmp/deploy/storage
          chmod -R 775 /tmp/deploy/bootstrap/cache

          echo "=== Deploy size ==="
          du -sh /tmp/deploy/
          echo "=== Total files ==="
          find /tmp/deploy/ -type f | wc -l

      # ── 🗜️ ZIP everything into one file ────────────────────
      - name: 🗜️ Compress into deploy.zip
        run: |
          cd /tmp/deploy
          zip -r -q deploy.zip .
          mv deploy.zip /tmp/
          echo "=== ZIP size ==="
          ls -lh /tmp/deploy.zip

      # ── Upload via lftp ──────────────────────────────────
      - name: 🚀 Upload deploy.zip + extract.php via lftp
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp > /dev/null 2>&1

          lftp -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} ftpupload.net << 'FTPSCRIPT'
          set net:timeout 60
          set net:max-retries 3
          set net:reconnect-interval-base 5
          set ftp:ssl-allow no

          # Make sure htdocs exists
          mkdir -f htdocs

          # Upload extract.php directly into htdocs (tiny, instant)
          put public/extract.php -o htdocs/extract.php

          # Upload deploy.zip into htdocs (single file, fast)
          put /tmp/deploy.zip -o htdocs/deploy.zip

          bye
          FTPSCRIPT

          echo "Upload complete"

      # ── Trigger extraction ────────────────────────────────
      - name: 🗜️ Extract deploy.zip on server
        run: |
          echo "Waiting 5s for upload to settle..."
          sleep 5

          RESULT=$(curl -s -w "\n%{http_code}" "https://ailearn.gt.tc/extract.php?key=ailearn-deploy-2026")
          HTTP_CODE=$(echo "$RESULT" | tail -1)
          BODY=$(echo "$RESULT" | head -n -1)

          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Extraction may have failed"
            exit 1
          fi

      - name: 🎉 Deployment finished
        run: echo "Deployment to https://ailearn.gt.tc/ completed!"
