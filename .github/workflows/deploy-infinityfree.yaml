name: 🚀 Deploy Laravel + Inertia to InfinityFree

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy to ailearn.gt.tc
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # ── PHP ───────────────────────────────────────────────
      - name: 🔧 Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, dom, filter, gd, json, zip, curl, opcache
          coverage: none

      # ── Composer ──────────────────────────────────────────
      - name: 📦 Install Composer dependencies (production)
        run: composer install --optimize-autoloader --no-dev --no-interaction --prefer-dist

      # ── Node.js / Vite ────────────────────────────────────
      - name: 🔧 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Node dependencies
        run: npm ci

      - name: 🏗️ Build frontend (Vite + Inertia)
        env:
          VITE_APP_NAME: "Antigravity AI"
          VITE_BASE_URL: "https://ailearn.gt.tc"
          VITE_API_BASE_URL: "https://ailearn.gt.tc"
          VITE_STORAGE_URL: "https://ailearn.gt.tc/storage"
        run: npm run build

      # ── Create .env from GitHub Secrets ───────────────────
      - name: 📝 Create .env file
        run: |
          echo 'APP_NAME="Antigravity AI"' > .env
          echo 'APP_ENV=production' >> .env
          echo 'APP_KEY=${{ secrets.APP_KEY }}' >> .env
          echo 'APP_DEBUG=false' >> .env
          echo 'APP_URL=https://ailearn.gt.tc' >> .env
          echo 'LOG_CHANNEL=stack' >> .env
          echo 'LOG_LEVEL=error' >> .env
          echo 'DB_CONNECTION=mysql' >> .env
          echo 'DB_HOST=${{ secrets.DB_HOST }}' >> .env
          echo 'DB_PORT=3306' >> .env
          echo 'DB_DATABASE=${{ secrets.DB_DATABASE }}' >> .env
          echo 'DB_USERNAME=${{ secrets.DB_USERNAME }}' >> .env
          echo 'DB_PASSWORD=${{ secrets.DB_PASSWORD }}' >> .env
          echo 'SESSION_DRIVER=file' >> .env
          echo 'CACHE_STORE=file' >> .env
          echo 'FILESYSTEM_DISK=local' >> .env
          echo 'QUEUE_CONNECTION=sync' >> .env

      # ── Laravel optimizations ─────────────────────────────
      - name: 🔑 Generate APP_KEY (if missing)
        run: php artisan key:generate --force 2>/dev/null || true

      - name: 🧹 Clear Caches
        run: |
          php artisan config:clear
          php artisan route:clear
          php artisan view:clear
          rm -f bootstrap/cache/*.php

      # ── Cleanup before deploy ─────────────────────────────
      - name: 🧹 Remove unnecessary files/folders
        run: |
          rm -rf \
            tests/ \
            node_modules/ \
            .git/ \
            .github/ \
            storage/framework/cache/data/* \
            storage/framework/views/* \
            storage/logs/* \
            .env.example \
            phpunit.xml \
            README.md \
            package-lock.json \
            vite.config.ts \
            tailwind.config.js \
            postcss.config.js \
            tsconfig.json \
            tsconfig.node.json

      # ── Prepare InfinityFree directory structure ──────────
      - name: 📁 Prepare InfinityFree directory structure
        run: |
          mkdir -p /tmp/deploy/htdocs

          # Copy public/ contents into htdocs/ (web root)
          cp -r public/* /tmp/deploy/htdocs/

          # Copy Laravel framework files to parent (above htdocs)
          cp -r app /tmp/deploy/
          cp -r bootstrap /tmp/deploy/
          cp -r config /tmp/deploy/
          cp -r database /tmp/deploy/
          cp -r resources /tmp/deploy/
          cp -r routes /tmp/deploy/
          cp -r vendor /tmp/deploy/
          cp composer.json /tmp/deploy/
          cp composer.lock /tmp/deploy/
          cp artisan /tmp/deploy/
          cp .env /tmp/deploy/

          # Make storage writable
          mkdir -p /tmp/deploy/storage/app/public
          mkdir -p /tmp/deploy/storage/framework/cache/data
          mkdir -p /tmp/deploy/storage/framework/sessions
          mkdir -p /tmp/deploy/storage/framework/views
          mkdir -p /tmp/deploy/storage/logs
          chmod -R 775 /tmp/deploy/storage
          chmod -R 775 /tmp/deploy/bootstrap/cache

      # ── Write index.php (no heredoc — avoid YAML issues) ──
      - name: 📄 Create htdocs/index.php
        run: |
          printf '<?php\n\nuse Illuminate\\Http\\Request;\n\ndefine('"'"'LARAVEL_START'"'"', microtime(true));\n\nif (file_exists($maintenance = __DIR__."'"'/../storage/framework/maintenance.php'"'"')) {\n    require $maintenance;\n}\n\nrequire __DIR__."'"'/../vendor/autoload.php'"'"';\n\n(require_once __DIR__."'"'/../bootstrap/app.php'"'"')\n    ->handleRequest(Request::capture());\n' > /tmp/deploy/htdocs/index.php

      # ── Deploy to InfinityFree via FTP ────────────────────
      - name: 🚀 Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftpupload.net
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: /tmp/deploy/
          server-dir: /
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            **/tests/**
            **/.env.example
            **/phpunit.xml
            **/.DS_Store
            **/*.log
          dangerous-clean-slate: false
          timeout: 86400000
          log-level: standard

      - name: 🎉 Deployment finished
        run: echo "Deployment to https://ailearn.gt.tc/ completed!"
