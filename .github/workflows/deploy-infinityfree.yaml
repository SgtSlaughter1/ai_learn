name: 🚀 Deploy Laravel + Inertia to InfinityFree

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy to ailearn.gt.tc
    # Pinned: the newest image (ubuntu-latest) has had unreliable package mirrors.
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # ── PHP ───────────────────────────────────────────────
      - name: 🔧 Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, dom, filter, gd, json, zip, curl, opcache
          coverage: none

      # ── Composer ──────────────────────────────────────────
      - name: 📦 Install Composer dependencies (production)
        run: composer install --optimize-autoloader --no-dev --no-interaction --prefer-dist

      # ── Node.js / Vite ────────────────────────────────────
      - name: 🔧 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install Node dependencies
        run: npm ci

      - name: 🏗️ Build frontend (Vite + Inertia)
        env:
          VITE_APP_NAME: "AceDrill"
          VITE_BASE_URL: "https://ailearn.gt.tc"
          VITE_API_BASE_URL: "https://ailearn.gt.tc"
          VITE_STORAGE_URL: "https://ailearn.gt.tc/storage"
        run: npm run build

      # ── Clear Caches
      - name: 🧹 Clear Caches
        run: |
          php artisan config:clear
          php artisan route:clear
          php artisan view:clear
          rm -f bootstrap/cache/*.php

      # ── Create root index.php ─────────────────────────────
      - name: 📄 Create root index.php
        run: cp public/root-index.php ./index.php

      # ── Prepare deploy directories ─────────────────────────
      # Splitting app code from vendor ensures your app & assets upload in seconds
      - name: 📁 Stage deployment files
        run: |
          mkdir -p /tmp/deploy_app
          mkdir -p /tmp/deploy_vendor

          # 1. Copy Application Code & Assets (Production-only, ~150 files)
          cp -r app /tmp/deploy_app/
          cp -r bootstrap /tmp/deploy_app/
          cp -r config /tmp/deploy_app/
          cp -r database /tmp/deploy_app/
          cp -r public /tmp/deploy_app/
          mkdir -p /tmp/deploy_app/resources
          cp -r resources/views /tmp/deploy_app/resources/
          cp -r resources/legal /tmp/deploy_app/resources/
          cp -r routes /tmp/deploy_app/

          # NOTE: .env is intentionally excluded so your live server .env is NEVER touched or overwritten
          cp .htaccess /tmp/deploy_app/
          cp artisan /tmp/deploy_app/
          cp composer.json /tmp/deploy_app/
          cp composer.lock /tmp/deploy_app/
          cp index.php /tmp/deploy_app/

          # Create storage directories
          mkdir -p /tmp/deploy_app/storage/app/public
          mkdir -p /tmp/deploy_app/storage/framework/cache/data
          mkdir -p /tmp/deploy_app/storage/framework/sessions
          mkdir -p /tmp/deploy_app/storage/framework/views
          mkdir -p /tmp/deploy_app/storage/logs

          touch /tmp/deploy_app/storage/app/public/.gitkeep
          touch /tmp/deploy_app/storage/framework/cache/data/.gitkeep
          touch /tmp/deploy_app/storage/framework/sessions/.gitkeep
          touch /tmp/deploy_app/storage/framework/views/.gitkeep
          touch /tmp/deploy_app/storage/logs/.gitkeep
          touch /tmp/deploy_app/bootstrap/cache/.gitkeep

          rm -f /tmp/deploy_app/public/root-index.php
          rm -f /tmp/deploy_app/public/server-index.php
          rm -f /tmp/deploy_app/public/extract.php

          # Ensure manifest and icons exist in both root and public to prevent shared-hosting 404s
          cp public/build/manifest.webmanifest /tmp/deploy_app/manifest.webmanifest
          cp public/build/manifest.webmanifest /tmp/deploy_app/public/manifest.webmanifest
          cp -r public/images /tmp/deploy_app/images

          # 2. Copy Vendor directory separately
          cp -r vendor/* /tmp/deploy_vendor/

          echo "=== App files to upload ==="
          find /tmp/deploy_app -type f | wc -l
          echo "=== Vendor files to sync ==="
          find /tmp/deploy_vendor -type f | wc -l

      # ── Check Composer changes ──────────────────────────────
      - name: 🔍 Check if composer dependencies changed
        id: composer_check
        run: |
          if git rev-parse HEAD~1 >/dev/null 2>&1 && git diff --name-only HEAD~1 HEAD | grep -E '^composer\.(json|lock)'; then
            echo "vendor_changed=true" >> $GITHUB_OUTPUT
            echo "Composer dependencies changed. Vendor sync will run."
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "vendor_changed=true" >> $GITHUB_OUTPUT
            echo "Manual workflow dispatch. Vendor sync will run."
          else
            echo "vendor_changed=false" >> $GITHUB_OUTPUT
            echo "Composer dependencies unchanged. Skipping vendor sync."
          fi

      # ── Deploy via lftp ────────────────────────────────────
      # lftp isn't on the runner. Ubuntu's package servers are sometimes unreachable from it
      # (DNS failures for every *.ubuntu.com host), so the package is cached between runs and,
      # without a cache, fetched from Ubuntu, then from the kernel.org mirror, then run in Docker.
      - name: 💾 Restore cached lftp package
        uses: actions/cache@v4
        with:
          path: ~/lftp-debs
          key: lftp-ubuntu-24.04-v1

      - name: 📦 Install lftp
        timeout-minutes: 20
        run: |
          set -u
          if command -v lftp >/dev/null; then exit 0; fi
          mkdir -p ~/lftp-debs
          OPTS="-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"

          save_deb() { cp /var/cache/apt/archives/lftp_*.deb ~/lftp-debs/ 2>/dev/null || true; }

          # 1. A copy from an earlier run.
          if ls ~/lftp-debs/lftp_*.deb >/dev/null 2>&1 && sudo dpkg -i ~/lftp-debs/lftp_*.deb && command -v lftp; then
            echo "Installed lftp from the cache"; exit 0
          fi

          # 2. Ubuntu's own servers.
          sudo rm -f /etc/apt/sources.list.d/google*.list /etc/apt/sources.list.d/chrome*.list /etc/apt/sources.list.d/microsoft*.list 2>/dev/null || true
          if timeout 240 sh -c "sudo apt-get $OPTS update -qq; sudo apt-get $OPTS install -y --no-install-recommends lftp"; then
            save_deb; echo "Installed lftp from Ubuntu"; exit 0
          fi

          # 3. The kernel.org mirror of Ubuntu, on a different domain.
          printf 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] http://mirrors.edge.kernel.org/ubuntu noble main universe\ndeb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] http://mirrors.edge.kernel.org/ubuntu noble-updates main universe\n' > /tmp/kernel-org.list
          KOPTS="$OPTS -o Dir::Etc::sourcelist=/tmp/kernel-org.list -o Dir::Etc::sourceparts=-"
          if timeout 240 sh -c "sudo apt-get $KOPTS update -qq && sudo apt-get $KOPTS install -y --no-install-recommends lftp"; then
            save_deb; echo "Installed lftp from the kernel.org mirror"; exit 0
          fi

          # 4. lftp inside a small Alpine container, behind a wrapper with the same command.
          if timeout 300 sh -c 'printf "FROM alpine:3.20\nRUN apk add --no-cache lftp\n" | docker build -q -t deploy-lftp -'; then
            printf '#!/bin/sh\nexec docker run --rm -i --network host -v /tmp:/tmp deploy-lftp lftp "$@"\n' | sudo tee /usr/local/bin/lftp >/dev/null
            sudo chmod +x /usr/local/bin/lftp
            echo "Using lftp in Docker"; exit 0
          fi

          echo "::error::Could not get lftp from the cache, Ubuntu, the kernel.org mirror or Docker. Re-run the workflow."
          exit 1

      # Clean old Vite build assets to ensure fresh hash references
      - name: 🧹 Clean old build assets on server
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ftpupload.net
        run: |
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<EOF || true
          set ssl:verify-certificate no
          set ftp:ssl-allow yes
          set ftp:passive-mode yes
          set net:timeout 30
          set net:max-retries 3

          mrm -f /htdocs/public/build/assets/* || true
          mrm -f /htdocs/public/build/workbox-*.js || true
          rm -f /htdocs/public/build/manifest.json || true
          rm -f /htdocs/public/build/manifest.webmanifest || true
          rm -f /htdocs/public/build/sw.js || true
          rm -f /htdocs/public/build/registerSW.js || true

          # Clean old root public static files to let fresh manifest and worker take over
          rm -f /htdocs/sw.js || true
          rm -f /htdocs/manifest.webmanifest || true
          rm -f /htdocs/public/sw.js || true
          rm -f /htdocs/public/manifest.webmanifest || true
          # Clean old migrations on server so renamed/deleted migrations never accumulate
          mrm -f /htdocs/database/migrations/* || true

          bye
          EOF

      # Deploy Application Code, Views, Public Assets & PWA Icons (FAST ~30s-60s)
      - name: 🚀 Deploy Application & PWA Assets
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ftpupload.net
        run: |
          UPLOADED=no
          for ATTEMPT in 1 2 3 4; do
            echo "=== App Upload attempt $ATTEMPT ==="
            if lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<EOF
          set ssl:verify-certificate no
          set ftp:ssl-allow yes
          set ftp:passive-mode yes
          set net:timeout 60
          set net:max-retries 10
          set net:reconnect-interval-base 10
          set net:reconnect-interval-multiplier 1.5
          set ftp:timezone ""

          # parallel=2 matches InfinityFree 2-connection limit to prevent IP bans
          mirror --reverse --verbose --no-perms --ignore-time --parallel=2 \
            --exclude-glob .DS_Store \
            --exclude-glob ".env*" \
            --exclude-glob "*.log" \
            --exclude-glob "*.map" \
            /tmp/deploy_app/ /htdocs/

          bye
          EOF
            then UPLOADED=yes; break; fi
            echo "Attempt $ATTEMPT had errors, waiting 20s for connection cooldown..."
            sleep 20
          done
          [ "$UPLOADED" = yes ] || { echo "::error::The app upload failed after 4 attempts."; exit 1; }

      # Deploy / Sync Vendor Dependencies (Skipped when composer.lock is unchanged)
      - name: 🚀 Sync Vendor Dependencies
        if: steps.composer_check.outputs.vendor_changed == 'true'
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ftpupload.net
        run: |
          UPLOADED=no
          for ATTEMPT in 1 2 3; do
            echo "=== Vendor Sync attempt $ATTEMPT ==="
            if lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<EOF
          set ssl:verify-certificate no
          set ftp:ssl-allow yes
          set ftp:passive-mode yes
          set net:timeout 60
          set net:max-retries 5
          set net:reconnect-interval-base 10
          set net:reconnect-interval-multiplier 1.5
          set ftp:timezone ""

          mirror --reverse --verbose --no-perms --ignore-time --parallel=2 \
            --exclude-glob .DS_Store \
            --exclude-glob ".env*" \
            /tmp/deploy_vendor/ /htdocs/vendor/

          bye
          EOF
            then UPLOADED=yes; break; fi
            echo "Attempt $ATTEMPT had errors, waiting 20s for connection cooldown..."
            sleep 20
          done
          [ "$UPLOADED" = yes ] || { echo "::error::The vendor upload failed after 3 attempts."; exit 1; }

      - name: 🎉 Deployment finished
        run: echo "Deployment to https://ailearn.gt.tc/ completed!"
