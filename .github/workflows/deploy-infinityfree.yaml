name: 🚀 Deploy Laravel + Inertia to InfinityFree

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy to ailearn.gt.tc
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # ── PHP ───────────────────────────────────────────────
      - name: 🔧 Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, dom, filter, gd, json, zip, curl, opcache
          coverage: none

      # ── Composer ──────────────────────────────────────────
      - name: 📦 Install Composer dependencies (production)
        run: composer install --optimize-autoloader --no-dev --no-interaction --prefer-dist

      # ── Node.js / Vite ────────────────────────────────────
      - name: 🔧 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Node dependencies
        run: npm ci

      - name: 🏗️ Build frontend (Vite + Inertia)
        env:
          VITE_APP_NAME: "Antigravity AI"
          VITE_BASE_URL: "https://ailearn.gt.tc"
          VITE_API_BASE_URL: "https://ailearn.gt.tc"
          VITE_STORAGE_URL: "https://ailearn.gt.tc/storage"
        run: npm run build

      # ── Create .env from GitHub Secrets ───────────────────
      - name: 📝 Create .env file
        run: |
          echo 'APP_NAME="Antigravity AI"' > .env
          echo 'APP_ENV=production' >> .env
          echo 'APP_KEY=${{ secrets.APP_KEY }}' >> .env
          echo 'APP_DEBUG=false' >> .env
          echo 'APP_URL=https://ailearn.gt.tc' >> .env
          echo 'LOG_CHANNEL=stack' >> .env
          echo 'LOG_LEVEL=error' >> .env
          echo 'DB_CONNECTION=mysql' >> .env
          echo 'DB_HOST=${{ secrets.DB_HOST }}' >> .env
          echo 'DB_PORT=3306' >> .env
          echo 'DB_DATABASE=${{ secrets.DB_DATABASE }}' >> .env
          echo 'DB_USERNAME=${{ secrets.DB_USERNAME }}' >> .env
          echo 'DB_PASSWORD=${{ secrets.DB_PASSWORD }}' >> .env
          echo 'SESSION_DRIVER=file' >> .env
          echo 'CACHE_STORE=file' >> .env
          echo 'FILESYSTEM_DISK=local' >> .env
          echo 'QUEUE_CONNECTION=sync' >> .env

      # ── Laravel optimizations ─────────────────────────────
      - name: 🔑 Generate APP_KEY (if missing)
        run: php artisan key:generate --force 2>/dev/null || true

      - name: 🧹 Clear Caches
        run: |
          php artisan config:clear
          php artisan route:clear
          php artisan view:clear
          rm -f bootstrap/cache/*.php

      # ── Remove files not needed on server ─────────────────
      - name: 🧹 Remove unnecessary files/folders
        run: |
          rm -rf \
            tests/ \
            node_modules/ \
            .git/ \
            .github/ \
            .editorconfig \
            .gitattributes \
            .gitignore \
            storage/framework/cache/data/* \
            storage/framework/views/* \
            storage/logs/* \
            .env.example \
            phpunit.xml \
            README.md \
            package.json \
            package-lock.json \
            vite.config.ts \
            tailwind.config.js \
            postcss.config.js \
            tsconfig.json \
            tsconfig.node.json

      # ── Aggressive vendor cleanup ─────────────────────────
      - name: ⚡ Clean vendor/ — remove tests, docs, maps, dev files
        run: |
          echo "=== Vendor exists? ==="
          test -d vendor || { echo "ERROR: vendor/ not found!"; exit 1; }
          echo "=== Vendor size BEFORE cleanup ==="
          du -sh vendor/

          # Remove test directories (only actual test folders, not vendor itself)
          find vendor/ -mindepth 2 -type d \( -name "tests" -o -name "Test" -o -name "test" -o -name "Tests" \) -exec rm -rf {} + 2>/dev/null || true
          # Remove docs
          find vendor/ -mindepth 2 -type d \( -name "docs" -o -name "doc" -o -name "Examples" -o -name "example" \) -exec rm -rf {} + 2>/dev/null || true
          # Remove source maps
          find vendor/ -mindepth 2 -name "*.map" -delete 2>/dev/null || true
          # Remove markdown
          find vendor/ -mindepth 2 -name "*.md" -delete 2>/dev/null || true
          # Remove txt (keep LICENSE)
          find vendor/ -mindepth 2 -name "*.txt" -not -name "LICENSE*" -delete 2>/dev/null || true
          # Remove git/CI files inside packages only
          find vendor/ -mindepth 2 -name ".git" -type d -exec rm -rf {} + 2>/dev/null || true
          find vendor/ -mindepth 2 -name ".github" -type d -exec rm -rf {} + 2>/dev/null || true
          find vendor/ -mindepth 2 \( -name ".gitignore" -o -name ".gitattributes" -o -name ".editorconfig" \
            -o -name ".php-cs-fixer*" -o -name "phpstan*" -o -name "phpunit.xml*" \
            -o -name ".phpunit.result.cache" -o -name "Makefile" -o -name "Dockerfile*" \
            -o -name "docker-compose*" -o -name ".travis.yml" \) -delete 2>/dev/null || true

          echo "=== Vendor exists after cleanup? ==="
          test -d vendor || { echo "ERROR: vendor/ was deleted by cleanup!"; exit 1; }
          echo "=== Vendor size AFTER cleanup ==="
          du -sh vendor/

      # ── Prepare InfinityFree directory structure ──────────
      - name: 📁 Prepare InfinityFree directory structure
        run: |
          mkdir -p /tmp/deploy/htdocs

          cp -r app /tmp/deploy/htdocs/
          cp -r bootstrap /tmp/deploy/htdocs/
          cp -r config /tmp/deploy/htdocs/
          cp -r database /tmp/deploy/htdocs/
          cp -r public /tmp/deploy/htdocs/
          cp -r resources /tmp/deploy/htdocs/
          cp -r routes /tmp/deploy/htdocs/
          cp .env /tmp/deploy/htdocs/
          cp artisan /tmp/deploy/htdocs/
          cp composer.json /tmp/deploy/htdocs/
          cp composer.lock /tmp/deploy/htdocs/

          # Copy extract.php to htdocs root (accessible before .htaccess rewrite)
          cp /tmp/deploy/htdocs/public/extract.php /tmp/deploy/htdocs/extract.php

          # Storage directories
          mkdir -p /tmp/deploy/htdocs/storage/app/public
          mkdir -p /tmp/deploy/htdocs/storage/framework/cache/data
          mkdir -p /tmp/deploy/htdocs/storage/framework/sessions
          mkdir -p /tmp/deploy/htdocs/storage/framework/views
          mkdir -p /tmp/deploy/htdocs/storage/logs
          chmod -R 775 /tmp/deploy/htdocs/storage
          chmod -R 775 /tmp/deploy/htdocs/bootstrap/cache

          # Verify vendor was copied
          test -d /tmp/deploy/htdocs/vendor || { echo "ERROR: vendor/ not copied to deploy dir!"; exit 1; }
          echo "=== Non-vendor size ==="
          du -sh /tmp/deploy/htdocs/

      # ── Tar vendor into ONE file ──────────────────────────
      # This is the key optimization: upload 1 file instead of 5000+
      - name: 📦 Compress vendor/ into single tar.gz
        run: |
          echo "=== Checking vendor exists ==="
          ls -la /tmp/deploy/htdocs/vendor/ | head -5
          test -d /tmp/deploy/htdocs/vendor || { echo "ERROR: vendor/ not found in deploy dir!"; exit 1; }
          echo "=== Tarring vendor ==="
          cd /tmp/deploy/htdocs
          tar -czf vendor.tar.gz vendor/
          rm -rf vendor/
          echo "=== vendor.tar.gz size ==="
          ls -lh vendor.tar.gz
          echo "=== Total deploy size ==="
          du -sh /tmp/deploy/htdocs/
          echo "=== File count ==="
          find /tmp/deploy/htdocs/ -type f | wc -l

      # ── Upload extract.php + vendor.tar.gz (2 files only!) ─
      - name: 🚀 Upload via lftp (2 files — extract.php + vendor.tar.gz)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp > /dev/null 2>&1

          lftp -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} ftpupload.net << 'FTPSCRIPT'
          set ftp:ssl-allow no
          set net:reconnect-interval-base 5
          set net:max-retries 3

          # Navigate to htdocs
          cd htdocs
          lcd /tmp/deploy/htdocs

          # Upload ONLY extract.php + vendor.tar.gz (2 files!)
          put extract.php
          put vendor.tar.gz

          bye
          FTPSCRIPT

      # ── Trigger extraction on server ──────────────────────
      - name: 🔄 Extract vendor on server
        run: |
          echo "Waiting 10s for upload to settle..."
          sleep 10

          RESULT=$(curl -s -w "\n%{http_code}" "https://ailearn.gt.tc/extract.php?key=ailearn-deploy-2026")
          HTTP_CODE=$(echo "$RESULT" | tail -1)
          BODY=$(echo "$RESULT" | head -n -1)

          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Extraction may have failed"
            exit 1
          fi

      - name: 🎉 Deployment finished
        run: echo "Deployment to https://ailearn.gt.tc/ completed!"
