name: 🚀 Deploy Laravel + Inertia to InfinityFree

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy to ailearn.gt.tc
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # ── PHP ───────────────────────────────────────────────
      - name: 🔧 Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, dom, filter, gd, json, zip, curl, opcache
          coverage: none

      # ── Composer ──────────────────────────────────────────
      - name: 📦 Install Composer dependencies (production)
        run: composer install --optimize-autoloader --no-dev --no-interaction --prefer-dist

      # ── Node.js / Vite ────────────────────────────────────
      - name: 🔧 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Node dependencies
        run: npm ci

      - name: 🏗️ Build frontend (Vite + Inertia)
        env:
          VITE_APP_NAME: "Antigravity AI"
          VITE_BASE_URL: "https://ailearn.gt.tc"
          VITE_API_BASE_URL: "https://ailearn.gt.tc"
          VITE_STORAGE_URL: "https://ailearn.gt.tc/storage"
        run: npm run build

      # ── Create .env from GitHub Secrets ───────────────────
      - name: 📝 Create .env file
        run: |
          echo 'APP_NAME="Antigravity AI"' > .env
          echo 'APP_ENV=production' >> .env
          echo 'APP_KEY=${{ secrets.APP_KEY }}' >> .env
          echo 'APP_DEBUG=false' >> .env
          echo 'APP_URL=https://ailearn.gt.tc' >> .env
          echo 'LOG_CHANNEL=stack' >> .env
          echo 'LOG_LEVEL=error' >> .env
          echo 'DB_CONNECTION=mysql' >> .env
          echo 'DB_HOST=${{ secrets.DB_HOST }}' >> .env
          echo 'DB_PORT=3306' >> .env
          echo 'DB_DATABASE=${{ secrets.DB_DATABASE }}' >> .env
          echo 'DB_USERNAME=${{ secrets.DB_USERNAME }}' >> .env
          echo 'DB_PASSWORD=${{ secrets.DB_PASSWORD }}' >> .env
          echo 'SESSION_DRIVER=file' >> .env
          echo 'CACHE_STORE=file' >> .env
          echo 'FILESYSTEM_DISK=local' >> .env
          echo 'QUEUE_CONNECTION=sync' >> .env

      # ── Laravel optimizations ─────────────────────────────
      - name: 🔑 Generate APP_KEY (if missing)
        run: php artisan key:generate --force 2>/dev/null || true

      - name: 🧹 Clear Caches
        run: |
          php artisan config:clear
          php artisan route:clear
          php artisan view:clear
          rm -f bootstrap/cache/*.php

      # ── Create root index.php ─────────────────────────────
      - name: 📄 Create root index.php
        run: cp public/root-index.php ./index.php

      # ── Prepare deploy directory ───────────────────────────
      # Copy only what's needed into a clean staging directory
      # This avoids uploading .git, node_modules, tests, etc.
      - name: 📁 Stage deployment files
        run: |
          mkdir -p /tmp/deploy

          # Copy only production-necessary directories and files
          cp -r app /tmp/deploy/
          cp -r bootstrap /tmp/deploy/
          cp -r config /tmp/deploy/
          cp -r database /tmp/deploy/
          cp -r public /tmp/deploy/
          cp -r resources /tmp/deploy/
          cp -r routes /tmp/deploy/
          cp -r vendor /tmp/deploy/

          # Copy root files
          cp .env /tmp/deploy/
          cp .htaccess /tmp/deploy/
          cp artisan /tmp/deploy/
          cp composer.json /tmp/deploy/
          cp composer.lock /tmp/deploy/
          cp index.php /tmp/deploy/

          # Create storage directories
          mkdir -p /tmp/deploy/storage/app/public
          mkdir -p /tmp/deploy/storage/framework/cache/data
          mkdir -p /tmp/deploy/storage/framework/sessions
          mkdir -p /tmp/deploy/storage/framework/views
          mkdir -p /tmp/deploy/storage/logs

          # Placeholder files so FTP creates the directories
          touch /tmp/deploy/storage/app/public/.gitkeep
          touch /tmp/deploy/storage/framework/cache/data/.gitkeep
          touch /tmp/deploy/storage/framework/sessions/.gitkeep
          touch /tmp/deploy/storage/framework/views/.gitkeep
          touch /tmp/deploy/storage/logs/.gitkeep
          touch /tmp/deploy/bootstrap/cache/.gitkeep

          # Remove files that shouldn't be on server
          rm -f /tmp/deploy/public/root-index.php
          rm -f /tmp/deploy/public/server-index.php
          rm -f /tmp/deploy/public/extract.php

          echo "=== Deploy size ==="
          du -sh /tmp/deploy
          echo "=== File count ==="
          find /tmp/deploy -type f | wc -l

      # ── Deploy via lftp ────────────────────────────────────
      - name: 📦 Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      # Clean old Vite build hashes before uploading new ones
      - name: 🧹 Clean old build assets on server
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ftpupload.net
        run: |
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<EOF || true
          set ssl:verify-certificate no
          set ftp:ssl-allow yes
          set ftp:passive-mode yes
          set net:timeout 30
          set net:max-retries 3

          # Remove old hashed build assets (they change every build)
          rm -rf /htdocs/public/build/assets
          rm -f /htdocs/public/build/manifest.json
          rm -f /htdocs/public/build/manifest.webmanifest
          rm -f /htdocs/public/build/sw.js
          rm -f /htdocs/public/build/registerSW.js
          rm -f /htdocs/public/build/workbox-*.js

          bye
          EOF
          echo "Old build assets cleaned (or didn't exist yet)"

      - name: 🚀 Deploy via lftp mirror
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ftpupload.net
        run: |
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<EOF
          set ssl:verify-certificate no
          set ftp:ssl-allow yes
          set ftp:passive-mode yes
          set net:timeout 60
          set net:max-retries 10
          set net:reconnect-interval-base 10
          set net:reconnect-interval-multiplier 2
          set ftp:timezone ""

          # Mirror into htdocs/ (InfinityFree web root)
          # --reverse      = upload (local → remote)
          # --ignore-time  = compare by SIZE only, not timestamps
          #                  (CI builds always have fresh timestamps, so without
          #                   this flag lftp re-uploads everything every deploy)
          # --no-perms     = skip chmod (InfinityFree ignores it)
          # --parallel=2   = low parallelism to avoid IP blocks
          # NO --delete    = don't remove server files not in local
          #                  (avoids deleting htdocs itself or user uploads)
          mirror --reverse --verbose --no-perms --parallel=2 --ignore-time \
            --exclude-glob .DS_Store \
            --exclude-glob "*.log" \
            --exclude-glob "*.map" \
            /tmp/deploy/ /htdocs/

          bye
          EOF

      - name: 🎉 Deployment finished
        run: echo "Deployment to https://ailearn.gt.tc/ completed!"
